<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>에어드랍 움짤 만들기</title>
  <style>
    /* 배경 화면 설정 */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #e5e5ea; /* 깃허브 배경과 잘 어울리는 색 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    /* 에어드랍 창 디자인 (보내주신 사진과 100% 똑같은 비율) */
    .airdrop-box {
      width: 320px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      overflow: hidden;
      text-align: center;
    }
    
    /* AirDrop 제목 부분 */
    .header {
      padding: 20px 0;
      font-size: 22px;
      font-weight: 600;
      background: #f9f9f9;
      color: #000;
    }
    
    /* 사진이 뜨는 빈 공간 */
    .image-area {
      width: 100%;
      height: 320px;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    /* 실제 뜰 사진 (처음엔 투명도 0으로 숨겨둠) */
    .image-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0; 
      transition: opacity 0.3s ease-in-out; /* 스르륵 나타나는 애니메이션 효과 */
    }
    
    /* 하단 버튼 영역 */
    .button-area {
      display: flex;
      border-top: 1px solid #d1d1d6;
      background: #f9f9f9;
    }
    
    .btn {
      flex: 1;
      padding: 16px 0;
      font-size: 17px;
      color: #007aff; /* 애플 특유의 파란색 */
      cursor: pointer;
      user-select: none;
    }
    
    .btn:active {
      background: #e5e5ea; /* 클릭했을 때 살짝 회색되는 효과 */
    }
    
    .decline { 
      border-right: 1px solid #d1d1d6; 
    }
  </style>
</head>
<body>

  <div class="airdrop-box">
    <div class="header">AirDrop</div>
    
    <div class="image-area">
      <!-- ⭐️여기에 띄우고 싶은 사진의 주소를 넣으세요!⭐️ -->
      <img id="target-image" src="https://images.unsplash.com/photo-1526045612212-70caf35c14df" alt="에어드랍 사진">
    </div>
    
    <div class="button-area">
      <div class="btn decline">Decline</div>
      <div class="btn accept" onclick="acceptAirdrop()">Accept</div>
    </div>
  </div>

  <script>
    // Accept 버튼을 누르면 실행되는 마법
    function acceptAirdrop() {
      // 사진의 투명도를 1(100%)로 바꿔서 스르륵 나타나게 합니다.
      document.getElementById('target-image').style.opacity = '1';
    }
  </script>

</body>
</html>
