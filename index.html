<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>에어드랍 움짤 자동 생성기</title>
  
  <!-- 화면 캡처 및 움짤 생성 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
  
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #e5e5ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
    }

    /* 1. 조종석 (움짤에는 안 나옴) */
    .control-panel {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      margin-bottom: 30px;
      box-sizing: border-box;
    }
    
    .control-panel h3 { margin: 0 0 20px 0; font-size: 18px; color: #333; text-align: center; }
    .input-group { margin-bottom: 18px; }
    .input-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #555; }
    .input-group input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
    .input-group input[type="file"] { width: 100%; font-size: 14px; }
    .input-group input[type="range"] { width: 100%; margin-top: 5px; }
    
    .btn-generate {
      width: 100%;
      padding: 14px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn-generate:hover { background: #005bb5; }
    
    #loading-text {
      display: none;
      text-align: center;
      color: #ff3b30;
      font-weight: bold;
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    /* 2. 실제 움짤로 캡처될 영역 (사진과 똑같은 디자인!) */
    #gif-frame {
      width: 360px;
      height: 480px; /* 전체 캔버스 크기 */
      background: transparent;
      position: relative;
      border-radius: 20px; /* 전체 모서리 둥글게 */
      overflow: hidden; /* 밖으로 튀어나가는 사진 자르기 */
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    /* 에어드랍 UI 본체 (수락 누르면 사라질 부분) */
    #airdrop-ui {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: white;
      position: absolute;
      top: 0; left: 0;
      z-index: 10;
    }

    /* 상단 헤더 (AirDrop 글씨와 이름) */
    .ad-header {
      background: #f5f5f5; /* 아주 연한 회색 */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 22px 0 18px 0;
    }
    .ad-header .title {
      font-size: 26px;
      font-weight: bold;
      color: #000;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .ad-header .subtitle {
      font-size: 15px;
      color: #000;
    }

    /* 중간 사진 영역 (틀 안의 사진) */
    .ad-image-container {
      flex: 1; /* 남은 공간을 꽉 채움 */
      overflow: hidden; /* 줌인 했을 때 튀어나가지 않게 */
      position: relative;
      background: #fff;
    }
    #ad-preview-image {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 화면 비율에 맞게 꽉 채움 */
      transform-origin: center center;
      transform: scale(1); /* 초기 줌 상태 */
    }

    /* 하단 버튼 영역 */
    .ad-footer {
      height: 56px;
      display: flex;
      background: #f5f5f5;
      border-top: 1px solid #e0e0e0;
    }
    .ad-btn {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 17px;
      color: #007aff;
      cursor: pointer;
    }
    .ad-btn.decline {
      border-right: 1px solid #e0e0e0;
    }

    /* 수락 후 보여질 전체 화면 이미지 (처음엔 숨김) */
    #fullscreen-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0; left: 0;
      z-index: 5;
      display: none; /* 숨김 */
    }

  </style>
</head>
<body>

  <!-- 조종석 -->
  <div class="control-panel">
    <h3>⚙️ 에어드랍 상세 설정</h3>
    <div class="input-group">
      <label>1. 보내는 사람 이름</label>
      <input type="text" id="name-input" value="🐈‍⬛❤️" placeholder="이름이나 이모티콘을 입력하세요">
    </div>
    <div class="input-group">
      <label>2. 나타날 사진 업로드</label>
      <input type="file" id="image-input" accept="image/*">
    </div>
    <div class="input-group">
      <label>3. 에어드랍 창 사진 확대(Zoom) 조절</label>
      <input type="range" id="zoom-slider" min="1" max="3" step="0.05" value="1">
    </div>
    <button class="btn-generate" id="generate-btn" onclick="startGifGeneration()">📸 이대로 움짤 만들기</button>
    <div id="loading-text">
      움짤을 열심히 촬영하고 굽는 중입니다... 🏃‍♂️💨<br>
      (약 5~10초 정도 걸리니 창을 닫지 마세요!)
    </div>
  </div>

  <!-- 촬영될 캔버스 영역 -->
  <div id="gif-frame">
    <!-- 상태 1: 에어드랍 창이 떠있는 상태 -->
    <div id="airdrop-ui">
      <div class="ad-header">
        <div class="title">AirDrop</div>
        <div class="subtitle"><span id="sender-name">🐈‍⬛❤️</span>님이 사진을 공유하려고 합니다.</div>
      </div>
      <div class="ad-image-container">
        <img id="ad-preview-image" src="" alt="업로드된 사진">
      </div>
      <div class="ad-footer">
        <div class="ad-btn decline">Decline</div>
        <div class="ad-btn accept" id="accept-btn">Accept</div>
      </div>
    </div>
    
    <!-- 상태 2: 수락 후 뜨는 전체 화면 -->
    <img id="fullscreen-image" src="" alt="전체 사진">
  </div>

  <script>
    let hasUploadedImage = false;

    // 1. 이름 실시간 반영
    document.getElementById('name-input').addEventListener('input', function() {
      document.getElementById('sender-name').innerText = this.value;
    });

    // 2. 사진 업로드 시 실시간 반영 (미리보기 & 전체화면 둘 다)
    document.getElementById('image-input').addEventListener('change', function(event) {
      if (event.target.files && event.target.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('ad-preview-image').src = e.target.result;
          document.getElementById('fullscreen-image').src = e.target.result;
          hasUploadedImage = true;
        };
        reader.readAsDataURL(event.target.files[0]);
      }
    });

    // 3. 사진 확대(Zoom) 실시간 반영
    document.getElementById('zoom-slider').addEventListener('input', function() {
      document.getElementById('ad-preview-image').style.transform = `scale(${this.value})`;
    });

    // 📸 대망의 움짤 촬영 및 생성 로직
    async function startGifGeneration() {
      if (!hasUploadedImage) {
        alert("먼저 움짤로 나타날 사진을 업로드해주세요!");
        return;
      }

      // 로딩 텍스트 표시
      document.getElementById('generate-btn').style.display = 'none';
      document.getElementById('loading-text').style.display = 'block';

      const gifFrame = document.getElementById('gif-frame');
      const airdropUi = document.getElementById('airdrop-ui');
      const acceptBtn = document.getElementById('accept-btn');
      const fullImage = document.getElementById('fullscreen-image');
      
      const framesData = []; 

      // 헬퍼 함수: 화면 찰칵 찍기
      const captureFrame = async () => {
        const canvas = await html2canvas(gifFrame, { 
          scale: 1.5, // 화질
          backgroundColor: null, 
          logging: false 
        });
        return canvas.toDataURL('image/png');
      };

      try {
        // [장면 1] 기본 에어드랍 대기 상태 (약 1.2초)
        const idleFrameURL = await captureFrame();
        for(let i = 0; i < 12; i++) { framesData.push(idleFrameURL); }

        // [장면 2] 'Accept' 버튼 클릭 효과 (약 0.3초)
        acceptBtn.style.backgroundColor = '#e5e5ea'; 
        const clickFrameURL = await captureFrame();
        for(let i = 0; i < 3; i++) { framesData.push(clickFrameURL); }

        // [장면 3] 에어드랍 UI 사라지고 전체 사진 등장! (약 1.5초)
        airdropUi.style.display = 'none'; 
        fullImage.style.display = 'block'; 

        const fullImageFrameURL = await captureFrame();
        for(let i = 0; i < 15; i++) { framesData.push(fullImageFrameURL); } 

        // 4. 찍어둔 사진들을 엮어서 하나의 GIF 파일로 합체!
        gifshot.createGIF({
          images: framesData,
          interval: 0.1, 
          gifWidth: gifFrame.offsetWidth,
          gifHeight: gifFrame.offsetHeight
        }, function(obj) {
          if(!obj.error) {
            // 완성된 파일 다운로드
            const link = document.createElement('a');
            link.download = 'airdrop-animation.gif';
            link.href = obj.image;
            link.click();
          } else {
            alert("움짤 생성 중 에러가 발생했습니다. 새로고침 후 다시 시도해주세요.");
          }
          
          // 모든 UI 원상 복구 (다음 촬영을 위해)
          acceptBtn.style.backgroundColor = 'transparent';
          airdropUi.style.display = 'flex';
          fullImage.style.display = 'none';
          
          document.getElementById('generate-btn').style.display = 'block';
          document.getElementById('loading-text').style.display = 'none';
        });

      } catch (error) {
        console.error(error);
        alert("캡처 중 문제가 발생했습니다.");
        document.getElementById('generate-btn').style.display = 'block';
        document.getElementById('loading-text').style.display = 'none';
      }
    }
  </script>
</body>
</html>
