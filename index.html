<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에어드랍 초고화질 영상 생성기</title>
<style>
  * { box-sizing: border-box; }
  body {
    display: flex; flex-direction: column; align-items: center;
    background: #e5e5ea; margin: 0; padding: 32px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
  }
  .panel {
    background: #fff; padding: 22px; border-radius: 16px; width: 100%; max-width: 400px;
    box-shadow: 0 4px 14px rgba(0,0,0,.1); margin-bottom: 24px;
  }
  .panel h3 { margin: 0 0 18px; font-size: 18px; text-align: center; color: #333; }
  .group { margin-bottom: 16px; }
  .group label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 8px; }
  .group input[type=text], .group input[type=file] {
    width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px;
  }
  .group input[type=range] { width: 100%; }
  button {
    width: 100%; padding: 14px; border: 0; border-radius: 10px; font-size: 16px; font-weight: bold;
    background: #007aff; color: #fff; cursor: pointer; margin-top: 8px;
  }
  button:disabled { background: #9ec9ff; cursor: default; }
  button.secondary { background: #e5e5ea; color: #007aff; }
  #status { text-align: center; font-size: 14px; color: #ff3b30; font-weight: bold; margin-top: 12px; min-height: 20px; line-height: 1.5; }
  #stage { width: 100%; max-width: 360px; }
  #canvas {
    display: block; width: 100%; height: auto; aspect-ratio: 1080 / 1446;
    border-radius: 20px; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,.15);
  }
  #result { display: none; width: 100%; max-width: 400px; margin-top: 24px; }
  #result video { width: 100%; max-width: 360px; display: block; margin: 0 auto 8px; border-radius: 16px; background: #000; }
  #result p { font-size: 13px; color: #555; text-align: center; margin: 4px 0 0; }
</style>
</head>
<body>

<div class="panel">
  <h3>⚙️ 에어드랍 상세 설정 (고화질 영상)</h3>
  <div class="group">
    <label>1. 보내는 사람 이름</label>
    <input type="text" id="name" value="🐈‍⬛❤️" placeholder="이름이나 이모티콘">
  </div>
  <div class="group">
    <label>2. 나타날 사진 업로드 (원본 화질 유지)</label>
    <input type="file" id="file" accept="image/*">
  </div>
  <div class="group">
    <label>3. 에어드랍 창 사진 확대(Zoom)</label>
    <input type="range" id="zoom" min="1" max="3" step="0.05" value="1">
  </div>
  <div class="group">
    <label>4. 사진 상하 위치 ↕️</label>
    <input type="range" id="ypos" min="0" max="100" step="1" value="50">
  </div>
  <button id="go">🎬 이대로 고화질 영상 만들기</button>
  <div id="status"></div>
</div>

<div id="stage"><canvas id="canvas" width="1080" height="1446"></canvas></div>

<div class="panel" id="result">
  <video id="player" controls playsinline loop></video>
  <button id="share">📱 사진첩에 저장 / 공유</button>
  <button id="download" class="secondary">⬇️ 파일로 다운로드</button>
  <p>아이폰: 공유 시트에서 "비디오 저장"을 누르면 사진첩에 저장됩니다.</p>
</div>

<script>
(() => {
  // ===== 기본 설정 =====
  const W = 1080, H = 1446;          // 출력 해상도
  const LW = 360, LH = 482;          // 논리 좌표 (원본 레이아웃)
  const S = W / LW;                  // 3배
  const HEADER_H = 66, FOOT_H = 56, IMG_SIZE = 360; // 66 + 360 + 56 = 482 (항상 고정)
  const FPS = 30;
  const T_CLICK = 1000, T_TRANS = 1200, TRANS_DUR = 500, T_END = 3200; // ms
  const MAX_SIDE = 2400;             // 업로드 이미지 최대 변 길이

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const FONT = '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto, sans-serif';

  let img = null;       // 다운스케일된 소스 (canvas 또는 bitmap)
  let recording = false;
  let lastUrl = null, lastFile = null;

  // ===== 이미지 로드 (한 번만 디코딩 + 크기 제한 + EXIF 회전) =====
  async function loadImage(file) {
    let src;
    try {
      src = await createImageBitmap(file, { imageOrientation: 'from-image' });
    } catch (e) {
      src = await new Promise((res, rej) => {
        const i = new Image(), u = URL.createObjectURL(file);
        i.onload = () => { res(i); };
        i.onerror = rej;
        i.src = u;
      });
    }
    const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
    const k = Math.min(1, MAX_SIDE / Math.max(w, h));
    const c = document.createElement('canvas');
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    const cx = c.getContext('2d');
    cx.imageSmoothingQuality = 'high';
    cx.drawImage(src, 0, 0, c.width, c.height);
    if (src.close) src.close();
    return c;
  }

  // ===== 그리기 유틸 =====
  function drawCover(x, y, w, h, zoom, posY) {
    const s = Math.max(w / img.width, h / img.height) * zoom;
    const dw = img.width * s, dh = img.height * s;
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) * posY, dw, dh);
    ctx.restore();
  }

  function drawContain() {
    const s = Math.min(LW / img.width, LH / img.height);
    const dw = img.width * s, dh = img.height * s;
    ctx.drawImage(img, (LW - dw) / 2, (LH - dh) / 2, dw, dh);
  }

  function fitText(text, maxW, size, weight) {
    let s = size;
    ctx.font = `${weight} ${s}px ${FONT}`;
    while (ctx.measureText(text).width > maxW && s > 8) {
      s -= 0.5; ctx.font = `${weight} ${s}px ${FONT}`;
    }
  }

  function drawAirdropUI(pressed) {
    const zoom = parseFloat($('zoom').value);
    const posY = parseInt($('ypos').value, 10) / 100;
    const name = $('name').value;

    // 배경
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, LW, LH);

    // 헤더
    ctx.fillStyle = '#f5f5f5'; ctx.fillRect(0, 0, LW, HEADER_H);
    ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `bold 22px ${FONT}`;
    ctx.fillText('AirDrop', LW / 2, 24);
    fitText(`${name}님이 사진을 공유하려고 합니다.`, LW - 20, 14, 'normal');
    ctx.fillText(`${name}님이 사진을 공유하려고 합니다.`, LW / 2, 47);

    // 사진 (정사각형 고정)
    ctx.fillStyle = '#fff'; ctx.fillRect(0, HEADER_H, LW, IMG_SIZE);
    if (img) drawCover(0, HEADER_H, LW, IMG_SIZE, zoom, posY);

    // 푸터
    const fy = HEADER_H + IMG_SIZE;
    ctx.fillStyle = '#f5f5f5'; ctx.fillRect(0, fy, LW, FOOT_H);
    if (pressed) { ctx.fillStyle = '#d1d1d6'; ctx.fillRect(LW / 2, fy, LW / 2, FOOT_H); }
    ctx.fillStyle = '#e0e0e0';
    ctx.fillRect(0, fy, LW, 1);
    ctx.fillRect(LW / 2 - 0.5, fy, 1, FOOT_H);
    ctx.fillStyle = '#007aff'; ctx.font = `normal 17px ${FONT}`;
    ctx.fillText('Decline', LW / 4, fy + FOOT_H / 2);
    ctx.fillText('Accept', LW * 3 / 4, fy + FOOT_H / 2);
  }

  // t(ms) 시점의 장면을 그린다 — 미리보기와 녹화가 같은 함수를 씀 (WYSIWYG)
  function drawScene(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';

    const p = Math.min(1, Math.max(0, (t - T_TRANS) / TRANS_DUR));
    const pressed = t >= T_CLICK;

    const place = (scale, alpha, fn) => {
      ctx.save();
      ctx.setTransform(S * scale, 0, 0, S * scale, W / 2 - (LW / 2) * S * scale, H / 2 - (LH / 2) * S * scale);
      ctx.globalAlpha = alpha;
      fn();
      ctx.restore();
    };

    if (p > 0 && img) place(1.05 - p * 0.05, p, drawContain);
    if (p < 1) place(1 - p * 0.05, 1 - p, () => drawAirdropUI(pressed));
  }

  // ===== 녹화 =====
  function pickMime() {
    const list = [
      'video/mp4;codecs=avc1.640028', 'video/mp4;codecs=avc1', 'video/mp4',
      'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'
    ];
    for (const m of list) if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
    return '';
  }

  async function generate() {
    if (!img) { alert('먼저 영상에 나올 사진을 업로드해주세요!'); return; }
    if (!window.MediaRecorder || !canvas.captureStream) {
      alert('이 브라우저는 영상 녹화를 지원하지 않습니다. 최신 Chrome 또는 Safari를 사용해주세요.'); return;
    }
    recording = true;
    $('go').disabled = true;
    $('result').style.display = 'none';
    $('status').textContent = '녹화 중입니다 🎬 (약 3초) 탭을 벗어나지 마세요!';

    const mime = pickMime();
    const stream = canvas.captureStream(FPS);
    const rec = new MediaRecorder(stream, {
      ...(mime ? { mimeType: mime } : {}),
      videoBitsPerSecond: 10000000
    });
    const chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    const done = new Promise(res => { rec.onstop = res; });

    drawScene(0);
    rec.start();

    await new Promise(resolve => {
      const start = performance.now();
      const tick = now => {
        const t = now - start;
        drawScene(Math.min(t, T_END));
        if (t < T_END) requestAnimationFrame(tick); else resolve();
      };
      requestAnimationFrame(tick);
    });

    await new Promise(r => setTimeout(r, 150)); // 마지막 프레임 확보
    rec.stop();
    await done;
    stream.getTracks().forEach(tr => tr.stop());

    const type = (rec.mimeType || mime || 'video/mp4').split(';')[0];
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(chunks, { type });
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(blob);
    lastFile = new File([blob], `airdrop-hq-video.${ext}`, { type });

    const player = $('player');
    player.src = lastUrl;
    $('result').style.display = 'block';
    $('status').textContent = ext === 'webm'
      ? '완료! (이 브라우저는 WebM으로 저장됩니다. 아이폰 사진첩용은 Safari를 쓰세요)'
      : '완료! 아래에서 저장하세요 ✅';
    $('share').style.display = (navigator.canShare && navigator.canShare({ files: [lastFile] })) ? 'block' : 'none';
    $('result').scrollIntoView({ behavior: 'smooth' });

    recording = false;
    $('go').disabled = false;
    drawScene(0);
  }

  // ===== 이벤트 =====
  const refresh = () => { if (!recording) drawScene(0); };
  $('name').addEventListener('input', refresh);
  $('zoom').addEventListener('input', refresh);
  $('ypos').addEventListener('input', refresh);

  $('file').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    $('status').textContent = '사진 불러오는 중...';
    try { img = await loadImage(f); $('status').textContent = ''; refresh(); }
    catch (err) { console.error(err); $('status').textContent = '이미지를 불러오지 못했습니다.'; }
  });

  $('go').addEventListener('click', () => generate().catch(err => {
    console.error(err);
    recording = false; $('go').disabled = false;
    $('status').textContent = '영상 생성 중 오류가 발생했습니다. 새로고침 후 다시 시도해주세요.';
  }));

  $('share').addEventListener('click', async () => {
    try { await navigator.share({ files: [lastFile] }); } catch (e) { /* 취소 */ }
  });

  $('download').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = lastUrl; a.download = lastFile.name; a.click();
  });

  drawScene(0);
})();
</script>
</body>
</html>
