<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>에어드랍 움짤 자동 생성기</title>
  
  <!-- 화면 캡처 및 움짤 생성 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
  
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #e5e5ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
    }

    /* 1. 설정 패널 (움짤에는 안 나옴) */
    .control-panel {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 360px;
      margin-bottom: 30px;
      box-sizing: border-box;
    }
    
    .control-panel h3 { margin: 0 0 15px 0; font-size: 18px; color: #333; text-align: center; }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #555; }
    .input-group input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
    .input-group input[type="file"] { width: 100%; font-size: 14px; }
    
    .btn-generate {
      width: 100%;
      padding: 14px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn-generate:hover { background: #005bb5; }
    
    #loading-text {
      display: none;
      text-align: center;
      color: #ff3b30;
      font-weight: bold;
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    /* 2. 실제 움짤로 캡처될 영역 (보내주신 사진과 똑같은 비율과 디자인) */
    #gif-frame {
      width: 340px;
      height: 380px;
      background: transparent;
      position: relative;
    }

    /* 에어드랍 UI 본체 */
    #airdrop-ui {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 18px; /* 사진과 동일한 둥근 모서리 */
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    /* 상단 AirDrop 헤더 */
    .ad-header {
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f9f9f9;
      font-size: 20px;
      font-weight: 600;
      color: #000;
      letter-spacing: -0.3px;
    }

    /* 중간 텍스트 영역 */
    .ad-body {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      padding: 20px;
    }
    #display-text {
      font-size: 16px;
      color: #000;
      text-align: center;
      line-height: 1.4;
      word-break: keep-all;
    }

    /* 하단 버튼 영역 */
    .ad-footer {
      height: 56px;
      display: flex;
      background: #f9f9f9;
      border-top: 1px solid #d1d1d6; /* 얇은 회색 선 */
    }

    .ad-btn {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 17px;
      color: #007aff; /* 애플 블루 */
    }
    .ad-btn.decline {
      border-right: 1px solid #d1d1d6;
    }

    /* 사진이 꽉 찰 때 보여질 이미지 엘리먼트 (처음엔 숨김) */
    #fullscreen-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* 프레임을 꽉 채움 */
      display: none; /* 초기 상태는 숨김 */
      border-radius: 18px; /* 처음엔 에어드랍 창과 동일한 둥글기 */
    }

  </style>
</head>
<body>

  <!-- 조종석 -->
  <div class="control-panel">
    <h3>⚙️ 에어드랍 움짤 설정</h3>
    <div class="input-group">
      <label>1. 안내 문구 입력</label>
      <input type="text" id="text-input" value="1장의 사진을 공유하려고 합니다." placeholder="문구를 입력하세요">
    </div>
    <div class="input-group">
      <label>2. 뜰 사진 업로드 (내 컴퓨터/폰)</label>
      <input type="file" id="image-input" accept="image/*">
    </div>
    <button class="btn-generate" id="generate-btn" onclick="startGifGeneration()">📸 이대로 움짤 만들기</button>
    <div id="loading-text">
      움짤을 열심히 촬영하고 굽는 중입니다... 🏃‍♂️💨<br>
      (약 5~10초 정도 걸리니 창을 닫지 마세요!)
    </div>
  </div>

  <!-- 촬영될 캔버스 영역 -->
  <div id="gif-frame">
    <!-- 에어드랍 UI 프레임 -->
    <div id="airdrop-ui">
      <div class="ad-header">AirDrop</div>
      <div class="ad-body">
        <div id="display-text">1장의 사진을 공유하려고 합니다.</div>
      </div>
      <div class="ad-footer">
        <div class="ad-btn decline">Decline</div>
        <div class="ad-btn accept" id="accept-btn">Accept</div>
      </div>
    </div>
    
    <!-- 전체화면으로 뜰 업로드 이미지 -->
    <img id="fullscreen-image" src="" alt="업로드된 사진">
  </div>

  <script>
    let hasUploadedImage = false;

    // 1. 텍스트 실시간 반영
    document.getElementById('text-input').addEventListener('input', function() {
      document.getElementById('display-text').innerText = this.value;
    });

    // 2. 사진 업로드 시 실시간 반영
    document.getElementById('image-input').addEventListener('change', function(event) {
      if (event.target.files && event.target.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('fullscreen-image').src = e.target.result;
          hasUploadedImage = true;
        };
        reader.readAsDataURL(event.target.files[0]);
      }
    });

    // 3. 📸 대망의 움짤 촬영 및 생성 로직
    async function startGifGeneration() {
      if (!hasUploadedImage) {
        alert("먼저 움짤로 나타날 사진을 업로드해주세요!");
        return;
      }

      // 버튼 숨기고 로딩 텍스트 표시
      document.getElementById('generate-btn').style.display = 'none';
      document.getElementById('loading-text').style.display = 'block';

      const gifFrame = document.getElementById('gif-frame');
      const airdropUi = document.getElementById('airdrop-ui');
      const acceptBtn = document.getElementById('accept-btn');
      const fullImage = document.getElementById('fullscreen-image');
      
      const framesData = []; // 촬영된 사진들이 담길 배열

      // 헬퍼 함수: 화면 찰칵 찍기 (고화질 유지를 위해 scale 2 적용)
      const captureFrame = async () => {
        const canvas = await html2canvas(gifFrame, { 
          scale: 1.5, 
          backgroundColor: null, // 투명 배경 유지
          logging: false 
        });
        return canvas.toDataURL('image/png');
      };

      try {
        // [장면 1] 기본 대기 상태 (수락 버튼 누르기 전)
        // 1번만 캡처하고 프레임을 복사해서 넣으면 생성 속도가 엄청 빨라집니다.
        const idleFrameURL = await captureFrame();
        for(let i = 0; i < 12; i++) { framesData.push(idleFrameURL); } // 약 1.2초 정지

        // [장면 2] 'Accept' 버튼 눌림! (배경색이 회색으로 바뀜)
        acceptBtn.style.backgroundColor = '#e5e5ea'; 
        const clickFrameURL = await captureFrame();
        for(let i = 0; i < 4; i++) { framesData.push(clickFrameURL); } // 약 0.4초 클릭 상태 유지

        // [장면 3] 에어드랍 UI가 완전히 사라지고 사진 전체가 등장!
        airdropUi.style.display = 'none'; // 에어드랍 틀 없애기
        fullImage.style.display = 'block'; // 사진 표시하기
        // 사진 전체가 보일 땐 모서리 둥글기 제거 (직사각형 꽉 차게)
        fullImage.style.borderRadius = '0'; 

        const fullImageFrameURL = await captureFrame();
        for(let i = 0; i < 15; i++) { framesData.push(fullImageFrameURL); } // 약 1.5초 사진 보여줌

        // 4. 찍어둔 사진들을 엮어서 하나의 GIF 파일로 합체!
        gifshot.createGIF({
          images: framesData,
          interval: 0.1, // 0.1초당 1프레임 (자연스러운 속도)
          gifWidth: 340,
          gifHeight: 380
        }, function(obj) {
          if(!obj.error) {
            // 완성된 파일 다운로드 트리거
            const link = document.createElement('a');
            link.download = 'airdrop-custom.gif';
            link.href = obj.image;
            link.click();
          } else {
            alert("움짤 생성 중 에러가 발생했습니다. 새로고침 후 다시 시도해주세요.");
          }
          
          // 모든 UI 원상 복구 (다음 촬영을 위해)
          acceptBtn.style.backgroundColor = 'transparent';
          airdropUi.style.display = 'flex';
          fullImage.style.display = 'none';
          fullImage.style.borderRadius = '18px';
